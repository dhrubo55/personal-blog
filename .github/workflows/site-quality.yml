name: Site quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: npm
      - name: Install Hugo Extended 0.146.7
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.146.7/hugo_extended_0.146.7_linux-amd64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" https://github.com/gohugoio/hugo/releases/download/v0.146.7/hugo_0.146.7_checksums.txt
          cd "$RUNNER_TEMP"
          grep ' hugo_extended_0.146.7_linux-amd64.tar.gz$' checksums.txt | sed 's/hugo_extended_0.146.7_linux-amd64.tar.gz/hugo.tar.gz/' | sha256sum --check --strict
          tar -xzf hugo.tar.gz hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:ai
      - run: npm run audit:site
      - name: Existing page smoke checks
        shell: pwsh
        run: |
          ./tests/llm-seo-smoke.ps1
          ./tests/support-page-smoke.ps1
      - name: Browser interactions and Worker protocol
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node scripts/serve-site.mjs public 8792 > .tools/site-quality/preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8792/ > /dev/null && break; sleep 1; done
          npm run verify:ai -- http://127.0.0.1:8792/
          npm run audit:browser -- http://127.0.0.1:8792/
      - name: Lighthouse, three ordinary runs per route and profile
        if: success()
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run audit:lighthouse -- http://127.0.0.1:8792/ public .tools/site-quality/lighthouse
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-quality-${{ github.sha }}
          path: |
            .tools/site-quality/
            .tools/ai-verification.json
            !.tools/site-quality/**/profiles/**
          retention-days: 14
