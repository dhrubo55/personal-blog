# Build Settings
[build]
  command = "curl -L https://github.com/gohugoio/hugo/releases/download/v0.166.0/hugo_extended_0.166.0_linux-amd64.tar.gz -o /tmp/hugo.tar.gz && mkdir -p /tmp/hugo && tar -xzf /tmp/hugo.tar.gz -C /tmp/hugo && npm ci && HUGO_BIN=/tmp/hugo/hugo npm run build"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

# Post Processing Settings
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true
