baseURL: "https://mohibulsblog.netlify.app"
languageCode: "en-us"
title: "Mohibul Hassan"
copyright: "© 2026 Mohibul Hassan Chowdhury. All rights reserved."
theme: "hugo-PaperMod"
pagination:
  pagerSize: 5
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
ignoreFiles:
  - 'content/day100\.md$'
  - 'content/posts/day100\.md$'
  - 'content/posts/mohibul-writing-guide\.md$'
minify:
  disableXML: true
  minifyOutput: true
mediaTypes:
  application/atom+xml:
    suffixes:
    - xml
  text/plain:
    suffixes:
    - txt
outputFormats:
  ATOM:
    mediaType: application/atom+xml
    baseName: atom
    isPlainText: false
    noUgly: true
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    noUgly: true
    notAlternative: true
outputs:
  home: [HTML, RSS, ATOM, LLMS]
  section: [HTML, RSS, ATOM]
  taxonomy: [HTML, RSS, ATOM]
  term: [HTML, RSS, ATOM]
params:
  env: production
  title: Mohibul Hassan
  author: Mohibul Hassan Chowdhury
